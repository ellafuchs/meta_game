<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>META'liach</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at top, #1a0533 0%, #0d0d1a 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
        }
        #bg-stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.3rem;
            margin-top: 4px;
            margin-bottom: 2px;
            background: linear-gradient(90deg, #FF6B6B, #FFD700, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.5;
        }
        .subtitle { font-size: 0.78rem; margin-bottom: 10px; opacity: 0.5; text-align: center; letter-spacing: 3px; text-transform: uppercase; }
        #hud {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 20px;
        }
        .hud-item { text-align: center; }
        .hud-label { font-size: 0.5rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 2px; }
        .hud-value { font-family: Inter, sans-serif; font-size: 0.65rem; font-weight: 700; color: #FFD700; margin-top: 4px; }
        .progress-wrap { width: 420px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
        #progress-bar { height: 100%; background: linear-gradient(90deg, #FF6B6B, #FFD700); border-radius: 3px; width: 0%; transition: width 0.25s; box-shadow: 0 0 8px rgba(255,215,0,0.6); }
        #game-container { position: relative; }
        canvas { border: 2px solid #4a9eca; border-radius: 16px; display: block; box-shadow: 0 0 60px rgba(100,50,200,0.3), 0 20px 60px rgba(0,0,0,0.6); }
        #overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(135,206,235,0.97);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 14px; text-align: center; padding: 28px;
        }
        #overlay-card {
            background: white;
            border: 5px solid white;
            border-radius: 16px;
            padding: 24px 28px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            color: #1a1a2e;
        }
        .poke-title { font-family: 'Press Start 2P', monospace; font-size: 1rem; margin-bottom: 12px; background: linear-gradient(90deg,#FF6B6B,#FFD700); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1.6; }
        .fail-title { font-family: 'Press Start 2P', monospace; font-size: 0.9rem; margin-bottom: 12px; color: #FF4444; text-shadow: 0 0 20px rgba(255,68,68,0.8); line-height:1.6; }
        .war-title  { font-family: 'Press Start 2P', monospace; font-size: 0.9rem; margin-bottom: 12px; color: #0038B8; text-shadow: 0 0 12px rgba(255,255,255,0.9), 0 2px 4px rgba(0,0,0,0.5); line-height:1.6; }
        #overlay p { font-size: 0.9rem; margin-bottom: 20px; line-height: 1.8; opacity: 0.9; }
        .badge { background: linear-gradient(135deg,#FFD700,#FF8C00); color: #1a1a2e; font-size: 0.7rem; font-weight: 700; padding: 5px 18px; border-radius: 20px; margin-bottom: 14px; font-family: 'Press Start 2P', monospace; }
        button { background: linear-gradient(135deg,#6C63FF,#FF6B6B); color:white; border:none; padding:12px 30px; font-size:0.75rem; border-radius:30px; cursor:pointer; font-weight:700; letter-spacing:1px; box-shadow:0 4px 20px rgba(108,99,255,0.5); transition:transform 0.1s; font-family:'Press Start 2P',monospace; }
        button:hover { transform:scale(1.06); }
        button:active { transform:scale(0.95); }
        #controls { margin-top:10px; font-size:0.7rem; opacity:0.4; letter-spacing:1px; }
        #celebration {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85);
            z-index:100; display:none;
            flex-direction:column; align-items:center; justify-content:center;
            text-align:center;
        }
        .confetti-piece {
            position:fixed; width:10px; height:10px; border-radius:2px;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity:0; }
        }
        .penguin {
            font-size:3rem;
            display:inline-block;
            animation: penguin-dance 0.5s ease-in-out infinite alternate;
            margin: 0 8px;
        }
        .penguin:nth-child(2) { animation-delay:0.15s; }
        .penguin:nth-child(3) { animation-delay:0.3s; }
        .penguin:nth-child(4) { animation-delay:0.45s; }
        @keyframes penguin-dance {
            0%   { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-20px) rotate(10deg); }
        }
        .celebration-title {
            font-family:'Press Start 2P',monospace;
            font-size:1.4rem;
            background:linear-gradient(90deg,#FF6B6B,#FFD700,#4ECDC4,#FF6B6B);
            background-size:200%;
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            animation: shimmer 1s linear infinite;
            margin-bottom:16px; line-height:1.8;
        }
        @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
        #music-btn { position:fixed; bottom:16px; right:16px; z-index:10; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:6px 12px; border-radius:18px; cursor:pointer; font-size:0.65rem; backdrop-filter:blur(6px); }
        #menu-btn { position:fixed; bottom:16px; left:16px; z-index:10; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:6px 12px; border-radius:18px; cursor:pointer; font-size:0.65rem; backdrop-filter:blur(6px); }
    </style>
</head>
<body>
<canvas id="bg-stars"></canvas>
<button id="music-btn" onclick="toggleMusic()">🎵 Music: OFF</button>
<button id="menu-btn" onclick="goToMenu()">← Back</button>
<div class="content">
    <h1>META'liach</h1>
    <p class="subtitle">Hunt. Recruit. Survive.</p>
    <div id="hud">
        <div class="hud-item"><div class="hud-label">Level</div><div class="hud-value" id="hud-level">1</div></div>
        <div class="hud-item"><div class="hud-label">Hired</div><div class="hud-value" id="hud-score">0</div></div>
        <div class="hud-item"><div class="hud-label">Needed</div><div class="hud-value" id="hud-next">5</div></div>
    </div>
    <div class="progress-wrap"><div id="progress-bar"></div></div>
    <div id="dark-note" style="font-size:0.75rem;opacity:0.7;margin-bottom:4px;height:16px;color:#FF6B6B"></div>
    <div id="game-container">
        <canvas id="gameCanvas" width="420" height="420"></canvas>
        <div id="overlay">
            <p style="color:#1a1a2e;margin-bottom:16px;font-size:1.1rem;font-weight:600">Catch all the candidates!<br>Watch out for blockers as you level up.</p>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
                <span style="color:#1a1a2e;font-weight:700;font-size:1.3rem">😊</span>
                <label style="position:relative;display:inline-block;width:52px;height:28px">
                    <input type="checkbox" id="dark-toggle" style="opacity:0;width:0;height:0">
                    <span id="toggle-track" style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:28px;transition:0.3s"></span>
                    <span id="toggle-thumb" style="position:absolute;content:'';height:20px;width:20px;left:4px;bottom:4px;background:white;border-radius:50%;transition:0.3s"></span>
                </label>
                <span style="color:#1a1a2e;font-weight:700;font-size:1.3rem">😈</span>
            </div>
            <button id="startBtn">START!</button>
        </div>
    </div>
    <div id="controls">ARROW KEYS / WASD &nbsp;·&nbsp; SWIPE ON MOBILE</div>
    <div id="celebration">
        <div class="celebration-title">🎉 LEVEL 6! 🎉<br>META'liach!</div>
        <div style="margin-bottom:24px">
            <span class="penguin">🐧</span>
            <span class="penguin">🐧</span>
            <span class="penguin">🐧</span>
            <span class="penguin">🐧</span>
        </div>
        <p style="color:white;font-size:1rem;margin-bottom:24px;opacity:0.9">You took Victor... and made him a VICTORY! 🏆<br><span style="font-size:0.85rem;opacity:0.7">He never saw it coming 😂</span></p>
        <button id="celebBtn">LET'S GO! 💙</button>
    </div>
</div>

<script>
// ── Stars ─────────────────────────────────────────────────────────
const bgC=document.getElementById('bg-stars'),bgX=bgC.getContext('2d');
bgC.width=window.innerWidth; bgC.height=window.innerHeight;
const stars=Array.from({length:120},()=>({x:Math.random()*bgC.width,y:Math.random()*bgC.height,r:Math.random()*1.5,a:Math.random()}));
(function drawS(){bgX.clearRect(0,0,bgC.width,bgC.height);stars.forEach(s=>{s.a+=0.004*(Math.random()-0.5);s.a=Math.max(0.1,Math.min(0.8,s.a));bgX.globalAlpha=s.a;bgX.fillStyle='white';bgX.beginPath();bgX.arc(s.x,s.y,s.r,0,Math.PI*2);bgX.fill();});bgX.globalAlpha=1;requestAnimationFrame(drawS);})();

// ── Music ─────────────────────────────────────────────────────────
let audioCtx=null, musicOn=false, musicGen=0;
const NOTES={E2:82.4,F2:87.3,A2:110,C3:130.8,D3:146.8,E3:164.8,F3:174.6,G3:196,A3:220,Bb3:233.1,C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,Bb4:466.2,B4:493.9,C5:523.3,D5:587.3,E5:659.3,G5:784,A5:880,F5:698.5};
const FUN_MELODY=['E5','E5','_','E5','_','C5','E5','_','G5','_','_','_','G4','_','_','_','C5','_','_','G4','_','_','E4','_','_','A4','_','B4','_','A4','_','_','A4','G4','E5','_','G5','A5','_','F5','G5','_','E5','_','C5','D5','B4','_'];
const DARK_MELODY=['E4','G4','Bb4','E5','G4','Bb4','E4','Bb4','E4','G4','Bb4','E5','Bb4','E5','Bb4','E4','E4','Bb4','E4','Bb4','E4','Bb4','E5','Bb4','G4','E4','G4','Bb4','G4','E4','Bb3','E4','Bb3','E4','Bb3','G3','E3','G3','Bb3','E4','G4','Bb4','E5','Bb4','G4','E4','Bb3','G3'];
function freq(n){return NOTES[n]||null;}
function toggleMusic(){musicOn=!musicOn;document.getElementById('music-btn').textContent='🎵 Music: '+(musicOn?'ON':'OFF');if(!musicOn&&audioCtx)audioCtx.suspend();else if(musicOn&&audioCtx)audioCtx.resume();}
function initMusic(){
    musicGen++;
    const gen=musicGen;
    if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const masterGain=audioCtx.createGain();masterGain.gain.value=0.12;masterGain.connect(audioCtx.destination);
    const MELODY=darkMode?DARK_MELODY:FUN_MELODY;
    const tempo=darkMode?60:130;
    const wave=darkMode?'sawtooth':'square';
    const noteLen=darkMode?0.055:0.13;
    let step=0;
    function playStep(){
        if(gen!==musicGen)return;
        if(!musicOn){setTimeout(playStep,200);return;}
        const note=MELODY[step%MELODY.length];
        if(note!=='_'&&freq(note)){
            try{
                const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
                osc.connect(g);g.connect(masterGain);
                osc.type=wave;osc.frequency.value=freq(note);
                const now=audioCtx.currentTime;
                g.gain.setValueAtTime(0.3,now);
                g.gain.exponentialRampToValueAtTime(0.001,now+noteLen);
                osc.start(now);osc.stop(now+noteLen+0.01);
            }catch(e){}
        }
        step++;
        setTimeout(playStep,tempo);
    }
    playStep();
}

// ── Pixel art: Anat ───────────────────────────────────────────────
// 10x10 grid, each pixel = 2x2 canvas pixels
const SP=[
    ['H','H','H','H','H','H','H','H','H','H'],
    ['H','G','L','G','H','H','G','L','G','H'],
    ['H','H','H','H','H','H','H','H','H','H'],
    ['H','H','K','K','K','K','K','K','H','H'],
    ['H','K','W','E','K','K','W','E','K','H'],
    ['H','K','K','K','K','K','K','K','K','H'],
    ['H','K','K','N','K','K','K','K','K','H'],
    ['H','K','M','M','M','K','K','K','K','H'],
    ['_','K','K','K','K','K','K','K','K','_'],
    ['_','B','B','B','B','B','B','B','B','_'],
];
const SC={'H':'#2C1008','G':'#111','L':'#4466AA','K':'#FECBA1','W':'#F8F8F8','E':'#5D8A5D','N':'#E8A070','M':'#CC6666','B':'#111111','_':null};
function drawAnat(px,py){
    SP.forEach((row,ry)=>row.forEach((c,rx)=>{
        if(!SC[c])return;
        ctx.fillStyle=SC[c];
        ctx.fillRect(px+rx*2,py+ry*2,2,2);
    }));
}

// ── Game ──────────────────────────────────────────────────────────
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const CELL=20,COLS=canvas.width/CELL,ROWS=canvas.height/CELL;
function PER_LEVEL(){if(level===1)return 4;if(level===2)return 5;if(level<=4)return 5;if(level===5)return 6;return 7;}
const PEOPLE=['🧑','👱','👦','👧','🧔','👩','🧑‍🦰','👱‍♀️','🧑‍🦳','🧕','👨','🧒'];
let darkMode=false;
const toggle=document.getElementById('dark-toggle');
const track=document.getElementById('toggle-track');
const thumb=document.getElementById('toggle-thumb');
toggle.addEventListener('change',()=>{
    darkMode=toggle.checked;
    track.style.background=darkMode?'#FF4444':'#ccc';
    thumb.style.transform=darkMode?'translateX(24px)':'translateX(0)';
});

let snake,dir,nextDir,recruits,blockers,score,level,levelScore,gameLoop,tick=0,waitingForInput=true,countdown=0;
let particles=[],catchFlash=[],floatingTexts=[],runners=[];
const rnd=n=>Math.floor(Math.random()*n);
const rndF=(a,b)=>a+Math.random()*(b-a);

function occupied(x,y){return snake.some(s=>s.x===x&&s.y===y)||recruits.some(r=>r.x===x&&r.y===y)||blockers.some(b=>b.x===x&&b.y===y);}
function safePos(){let p,t=0;do{p={x:rnd(COLS),y:rnd(ROWS)};t++;}while(t<200&&(occupied(p.x,p.y)||(Math.abs(p.x-snake[0].x)+Math.abs(p.y-snake[0].y))<4));return p;}
function numRecruits(){return Math.min(3+level,8);}
function numBlockers(){return Math.max(0,Math.min(level-1,9));}
function recruitSpeed(){return Math.max(1,4-Math.floor(level/2));}
function blockerKind(i){
    const types=darkMode?['google','amazon','war','fired']:['google','amazon'];
    if(level>=5&&darkMode)types.push('victor');
    return types[i%types.length];
}

function init(keepLevel){
    if(!keepLevel){level=1;score=0;}
    levelScore=0;tick=0;particles=[];catchFlash=[];runners=[];floatingTexts=[];catchCount=0;waitingForInput=false;countdown=0;
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0};nextDir={x:1,y:0};
    recruits=[];blockers=[];
    for(let i=0;i<numRecruits();i++)recruits.push({...safePos(),emoji:PEOPLE[rnd(PEOPLE.length)]});
    for(let i=0;i<numBlockers();i++)blockers.push({...safePos(),kind:blockerKind(i)});
    updateHUD();
}

function updateHUD(){
    document.getElementById('hud-level').textContent=level;
    document.getElementById('hud-score').textContent=score;
    document.getElementById('hud-next').textContent=Math.max(0,PER_LEVEL()-levelScore);
    document.getElementById('progress-bar').style.width=Math.min((levelScore/PER_LEVEL())*100,100)+'%';
    const darkNote=document.getElementById('dark-note');
    darkNote.textContent='';
}

function moveRecruits(){
    const h=snake[0];
    const cx=recruits.reduce((s,r)=>s+r.x,0)/recruits.length;
    const cy=recruits.reduce((s,r)=>s+r.y,0)/recruits.length;
    recruits.forEach(r=>{
        const d=Math.abs(r.x-h.x)+Math.abs(r.y-h.y);
        let mx=0,my=0;
        if(d<6){mx+=Math.sign(r.x-h.x)*2;my+=Math.sign(r.y-h.y)*2;}
        else{mx+=Math.sign(cx-r.x)*0.4;my+=Math.sign(cy-r.y)*0.4;}
        mx+=rndF(-0.8,0.8);my+=rndF(-0.8,0.8);
        let nx=r.x,ny=r.y;
        if(Math.abs(mx)>=Math.abs(my))nx=r.x+Math.sign(mx);else ny=r.y+Math.sign(my);
        nx=Math.max(0,Math.min(COLS-1,nx));ny=Math.max(0,Math.min(ROWS-1,ny));
        if(!blockers.some(b=>b.x===nx&&b.y===ny)&&!recruits.some(o=>o!==r&&o.x===nx&&o.y===ny)){r.x=nx;r.y=ny;}
    });
}

const FIRE_MSGS=['ANAT IS ON FIRE 🔥','SHE\'S UNSTOPPABLE 🔥','ON FIRE!! 🔥','GO ANAT!! 💪'];
let catchCount=0;
function spawnParticles(x,y){
    for(let i=0;i<14;i++){const a=(i/14)*Math.PI*2;particles.push({x:x*CELL+CELL/2,y:y*CELL+CELL/2,vx:Math.cos(a)*rndF(1.5,4),vy:Math.sin(a)*rndF(1.5,4),life:1});}
    catchFlash.push({x,y,life:1});
    catchCount++;
    const txt=catchCount%4===0?FIRE_MSGS[rnd(FIRE_MSGS.length)]:'+1 HIRED!';
    const tx=Math.max(50,Math.min(canvas.width-50,x*CELL+CELL/2));
    floatingTexts.push({x:tx, y:y*CELL-6, life:1, text:txt});
}

function update(){
    if(waitingForInput||countdown>0){draw();return;}
    tick++;dir=nextDir;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS){endGame('wall');return;}
    if(snake.some(s=>s.x===h.x&&s.y===h.y)){endGame('self');return;}
    const hb=blockers.find(b=>b.x===h.x&&b.y===h.y);
    if(hb){endGame(hb.kind);return;}
    snake.unshift(h);
    let ate=false;
    recruits=recruits.filter(r=>{if(r.x===h.x&&r.y===h.y){spawnParticles(r.x,r.y);score++;levelScore++;ate=true;return false;}return true;});
    if(!ate)snake.pop();
    while(recruits.length<numRecruits())recruits.push({...safePos(),emoji:PEOPLE[rnd(PEOPLE.length)]});
    if(tick%recruitSpeed()===0)moveRecruits();
    particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.87;p.vy*=0.87;p.life-=0.055;return p.life>0;});
    floatingTexts=floatingTexts.filter(t=>{t.y-=5;t.life-=0.35;return t.life>0;});
    // Spawn runners in dark mode
    if(darkMode && tick%80===0){
        const fromLeft=Math.random()>0.5;
        runners.push({x:fromLeft?-1:COLS, y:rnd(ROWS), dx:fromLeft?1:-1, px:fromLeft?-CELL:canvas.width, py:0});
    }
    runners=runners.filter(r=>{
        r.px+=r.dx*2.5;
        r.x=Math.round(r.px/CELL);
        if(r.x===snake[0].x&&r.y===snake[0].y){
            snake.splice(-3);
            for(let i=0;i<14;i++){const a=(i/14)*Math.PI*2;particles.push({x:snake[0].x*CELL+CELL/2,y:snake[0].y*CELL+CELL/2,vx:Math.cos(a)*rndF(1.5,4),vy:Math.sin(a)*rndF(1.5,4),life:1});}
            catchFlash.push({x:snake[0].x,y:snake[0].y,life:1});
        }
        return r.px>-CELL&&r.px<canvas.width+CELL;
    });
    catchFlash=catchFlash.filter(f=>{f.life-=0.09;return f.life>0;});
    updateHUD();
    if(levelScore>=PER_LEVEL())levelUp();
}

// ── Blocker drawing ───────────────────────────────────────────────
function drawGoogle(cx,cy){
    const r=CELL/2-2;
    ctx.fillStyle='white';ctx.beginPath();ctx.arc(cx,cy,r+1,0,Math.PI*2);ctx.fill();
    [{s:-0.1*Math.PI,e:0.45*Math.PI,c:'#4285F4'},{s:0.45*Math.PI,e:0.95*Math.PI,c:'#34A853'},{s:0.95*Math.PI,e:1.45*Math.PI,c:'#FBBC04'},{s:1.45*Math.PI,e:1.9*Math.PI,c:'#EA4335'}]
        .forEach(a=>{ctx.strokeStyle=a.c;ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(cx,cy,r-1.5,a.s,a.e);ctx.stroke();});
    ctx.fillStyle='white';ctx.fillRect(cx,cy-2.5,r-2,5);
    ctx.fillStyle='#4285F4';ctx.font=`bold ${CELL*0.45}px Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('G',cx-1,cy+1);
}
function drawAmazon(cx,cy){
    const r=CELL/2-2;
    ctx.fillStyle='#FF9900';ctx.beginPath();ctx.arc(cx,cy,r+1,0,Math.PI*2);ctx.fill();
    ctx.font=`${CELL*0.7}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('📦',cx,cy+1);
}
function drawVictor(cx,cy){
    const r=CELL/2-1,pulse=0.6+0.4*Math.sin(tick*0.2);
    ctx.fillStyle=`rgba(180,0,0,${pulse})`;ctx.beginPath();ctx.arc(cx,cy,r+3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.font=`${CELL*0.75}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('😤',cx,cy+1);
}
function drawWar(cx,cy){
    const r=CELL/2-2,pulse=0.6+0.4*Math.sin(tick*0.15);
    ctx.fillStyle=`rgba(139,0,0,${pulse})`;ctx.beginPath();ctx.arc(cx,cy,r+3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#990000';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.font=`${CELL*0.7}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚔️',cx,cy+1);
}
function drawFired(cx,cy){
    const w=CELL-2,h=CELL-4,pulse=0.7+0.3*Math.sin(tick*0.2);
    ctx.fillStyle=`rgba(255,0,0,${pulse})`;ctx.fillRect(cx-w/2-2,cy-h/2-2,w+4,h+4);
    ctx.fillStyle='#fff';ctx.fillRect(cx-w/2,cy-h/2,w,h);
    ctx.fillStyle='#cc0000';ctx.font=`bold ${CELL*0.28}px Inter,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('YOU\'RE',cx,cy-CELL*0.18);
    ctx.fillText('FIRED',cx,cy+CELL*0.14);
}

// ── Main draw ─────────────────────────────────────────────────────
function draw(){
    ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='rgba(255,255,255,0.12)';
    for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){ctx.beginPath();ctx.arc(x*CELL+CELL/2,y*CELL+CELL/2,1.5,0,Math.PI*2);ctx.fill();}

    catchFlash.forEach(f=>{ctx.strokeStyle=`rgba(255,215,0,${f.life*0.7})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x*CELL+CELL/2,f.y*CELL+CELL/2,CELL*(1-f.life)*2.5,0,Math.PI*2);ctx.stroke();});

    snake.forEach((seg,i)=>{
        if(i===0)return;
        const t=1-(i/snake.length)*0.6;
        ctx.fillStyle=`hsla(${260-i*3},80%,60%,${t})`;
        const bx=seg.x*CELL+3,by=seg.y*CELL+3,s=CELL-6;
        ctx.beginPath();ctx.moveTo(bx+4,by);ctx.lineTo(bx+s-4,by);ctx.quadraticCurveTo(bx+s,by,bx+s,by+4);ctx.lineTo(bx+s,by+s-4);ctx.quadraticCurveTo(bx+s,by+s,bx+s-4,by+s);ctx.lineTo(bx+4,by+s);ctx.quadraticCurveTo(bx,by+s,bx,by+s-4);ctx.lineTo(bx,by+4);ctx.quadraticCurveTo(bx,by,bx+4,by);ctx.closePath();ctx.fill();
    });

    if(snake.length>0){
        ctx.shadowColor='rgba(180,100,255,0.9)';ctx.shadowBlur=16;
        ctx.font=`${CELL+2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('👩‍🦱',snake[0].x*CELL+CELL/2,snake[0].y*CELL+CELL/2+1);
        ctx.shadowBlur=0;
    }

    blockers.forEach(b=>{
        const cx=b.x*CELL+CELL/2,cy=b.y*CELL+CELL/2;
        ctx.shadowBlur=10;ctx.shadowColor='rgba(200,100,100,0.5)';
        if(b.kind==='google')drawGoogle(cx,cy);
        else if(b.kind==='amazon')drawAmazon(cx,cy);
        else if(b.kind==='victor')drawVictor(cx,cy);
        else if(b.kind==='fired')drawFired(cx,cy);
        else drawWar(cx,cy);
        ctx.shadowBlur=0;
    });

    recruits.forEach(r=>{
        const pulse=0.6+0.4*Math.sin(tick*0.18+r.x*0.5);
        ctx.shadowColor='rgba(100,255,180,0.8)';ctx.shadowBlur=14*pulse;
        ctx.font=`${CELL+2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(r.emoji,r.x*CELL+CELL/2,r.y*CELL+CELL/2+1);
        ctx.shadowBlur=0;
    });

    // Runners (dark mode)
    runners.forEach(r=>{
        ctx.font=`${CELL}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(r.dx>0?'🏃':'🏃‍♂️',r.px+CELL/2,r.y*CELL+CELL/2);
        ctx.font='bold 8px Inter,sans-serif';
        ctx.fillStyle='#FF4444';ctx.textAlign='center';
        ctx.fillText('GO HOME!',r.px+CELL/2,r.y*CELL-4);
    });
    particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=`hsl(${rnd(60)+30},100%,65%)`;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();});
    floatingTexts.forEach(t=>{ctx.globalAlpha=t.life;ctx.font='bold 16px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle='#FFD700';ctx.fillText(t.text,t.x,t.y);});
    ctx.globalAlpha=1;
    if(countdown>0){
        ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.font='bold 120px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.lineWidth=6;ctx.strokeStyle='#000';ctx.strokeText(countdown,canvas.width/2,canvas.height/2);
        ctx.fillStyle='#FFD700';ctx.fillText(countdown,canvas.width/2,canvas.height/2);
    }else if(waitingForInput){
        ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.font='bold 22px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='#fff';ctx.fillText('Press any arrow key',canvas.width/2,canvas.height/2);
    }
}

// ── Overlays ──────────────────────────────────────────────────────
function levelUp(){
    clearInterval(gameLoop);level++;
    const DARK_WIN=[
        'You are on fire 🔥 (the good way :-P)',
        'Screw you Zuck. She keeps going. 😤',
        'Recruiter mode: UNLOCKED. 🔓',
        'Mark, META\'liach! :)))',
        'Iran won\'t stop me. 🇮🇱',
        'Wars, layoffs, Victor — STILL HERE. 💪',
        'They tried everything. She\'s unstoppable. 🔥'
    ];
    const darkWinLine=darkMode?`<br><span style="color:#FF6B6B;font-size:0.82rem">${DARK_WIN[rnd(DARK_WIN.length)]}</span>`:'';
    if(level===7){
        showCelebration(()=>{
            const darkFinal=darkMode?'<br><span style="color:#FF6B6B;font-size:1rem;font-weight:700">Screw you Zuck. She won. 😤</span>':'';
            overlay.innerHTML=`<div class="badge">YOU BEAT THE GAME!</div><div class="poke-title">META'liach! 💙</div><p><span style="color:#FFD700;font-size:1.1rem">Anat, you are UNSTOPPABLE. 🔥</span>${darkFinal}</p><button id="startBtn">PLAY AGAIN</button>`;
            overlay.style.display='flex';
            document.getElementById('startBtn').addEventListener('click',()=>{overlay.style.display='none';level=1;score=0;initMusic();init(false);draw();startLoop();});
        });
        return;
    }
    if(level===6){
        showCelebration(()=>{
            overlay.innerHTML=`<div class="badge">LEVEL 6!</div><div class="poke-title">TEAM IS GROWING!</div><button id="startBtn">${darkMode?'FIGHT VICTOR!':'GO!'}</button>`;
            overlay.style.display='flex';
            document.getElementById('startBtn').addEventListener('click',()=>{overlay.style.display='none';init(true);draw();startLoop();});
        });
        return;
    }
    const winLine=darkMode?`<p><span style="color:#FF6B6B;font-size:1.1rem;font-weight:700">${DARK_WIN[rnd(DARK_WIN.length)]}</span></p>`:`<p><span style="color:#FFD700;font-size:1.2rem;font-weight:700">You're unstoppable! 🕶️</span></p>`;
    overlay.innerHTML=`<div class="badge">LEVEL ${level-1} CLEAR!</div>${winLine}<button id="startBtn">LEVEL ${level} — GO!</button>`;
    overlay.style.display='flex';
    document.getElementById('startBtn').addEventListener('click',()=>{overlay.style.display='none';init(true);draw();startLoop();});
}

function endGame(reason){
    clearInterval(gameLoop);
    let icon,titleClass,title,msg;
    if(reason==='google'){
        icon='🔵🔴🟡🟢';titleClass='fail-title';title='POACHED BY GOOGLE';
        msg=['"We can match that offer..." — they lied.','Your candidate just got a FAANG counter-offer. Oof.','Google swooped in at the last second. Classic.'][rnd(3)];
    } else if(reason==='amazon'){
        icon='📦';titleClass='fail-title';title='SHIPPED TO AMAZON';
        msg=['Two-day delivery to Seattle. Prime move.','Bezos wins this round. Next time, Anat!','Amazon one-clicked your whole pipeline!'][rnd(3)];
    } else if(reason==='war'){
        icon='🕊️🇮🇱🕊️';titleClass='war-title';title='AM YISRAEL CHAI';
        msg='You carry this and still show up every day.<br>That\'s the strongest thing there is. 💙';
    } else if(reason==='fired'){
        icon='📄';titleClass='fail-title';title='YOU\'RE FIRED!';
        msg=['HR walked in with the package. Ouch.','Zuck just signed your pink slip. 😤','Pack your stapler, Anat. 🥲'][rnd(3)];
    } else if(reason==='victor'){
        icon='😤';titleClass='fail-title';title='BAD VICTOR';
        msg=['Victor blocked you. Again. AGAIN.','Victor says: "Tell me about a time you failed." THIS TIME.','Rejected by Victor. Not your fault. Never was.'][rnd(3)];
    } else if(reason==='wall'){
        icon='🧱';titleClass='fail-title';
        if(darkMode){title=['SYSTEM DESIGN FAIL','CODING FAIL'][rnd(2)];msg=['Even the servers are stressed. 💀','Walked straight into the whiteboard.','Edge case detected: the wall.'][rnd(3)];}
        else{title='OUCH!';msg=['Walked right into that wall.','The wall wins this round.','Next time, steer around it!'][rnd(3)];}
    } else if(reason==='self'){
        icon='🌀';titleClass='fail-title';title='ERRORRRR!!!';
        msg=['You tried to recruit yourself. CANNOT COMPUTE.','Self-hire detected. System exploded.','Recruiting yourself is illegal in 12 countries.'][rnd(3)];
    } else {
        icon='💥';titleClass='fail-title';
        if(darkMode){
            const t=['SYSTEM DESIGN FAIL','CODING FAIL','VICTOR BOZZ'];
            title=t[rnd(3)];
            msg=['8000 people fired and you\'re out here trying. Respect. 🫡',
                 'Screw you Zuck. She\'ll be back. 😤',
                 'Stack overflow. Even the servers are stressed. 💀',
                 'CODING FAIL — but also, screw you Zuck.'][rnd(4)];
        } else {
            title='TRY AGAIN!';
            msg=['So close! 🌟','You\'ve got this! 💪','One more time! 🚀'][rnd(3)];
        }
    }
    const DARK_QUIPS=['Screw you Zuck. She\'ll be back. 😤','Even the servers are crying. 💀','Screw. You. Zuck.'];
    const darkLine=darkMode?`<br><span style="color:#FF6B6B;font-size:1.05rem;opacity:0.95;font-weight:600">${DARK_QUIPS[rnd(DARK_QUIPS.length)]}</span>`:'';
    const subLine=darkMode?darkLine.replace(/^<br>/,''):msg;
    overlay.innerHTML=`<div style="font-size:1.8rem;margin-bottom:10px">${icon}</div><div class="${titleClass}">${title}</div><p style="font-size:1.05rem">${subLine}<br><br>Level: <strong>${level}</strong> &nbsp;·&nbsp; Hired: <strong style="color:#FFD700;font-size:1.2rem">${score}</strong></p><button id="startBtn">TRY AGAIN</button>`;
    overlay.style.display='flex';
    document.getElementById('startBtn').addEventListener('click',()=>{overlay.style.display='none';init(false);draw();startLoop();});
}

function gameSpeed(){return Math.max(70,145-level*12);}
function startLoop(){clearInterval(gameLoop);gameLoop=setInterval(()=>{update();draw();},gameSpeed());}
function goToMenu(){
    clearInterval(gameLoop);
    overlay.innerHTML=`
        <p style="color:#1a1a2e;margin-bottom:16px;font-size:1.1rem;font-weight:600">Catch all the candidates!<br>Watch out for blockers as you level up.</p>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
            <span style="color:#1a1a2e;font-weight:700;font-size:1.3rem">😊</span>
            <label style="position:relative;display:inline-block;width:52px;height:28px">
                <input type="checkbox" id="dark-toggle2" ${darkMode?'checked':''} style="opacity:0;width:0;height:0">
                <span id="tt2" style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:${darkMode?'#FF4444':'#ccc'};border-radius:28px;transition:0.3s"></span>
                <span id="th2" style="position:absolute;height:20px;width:20px;left:4px;bottom:4px;background:white;border-radius:50%;transition:0.3s;transform:${darkMode?'translateX(24px)':'translateX(0)'}"></span>
            </label>
            <span style="color:#1a1a2e;font-weight:700;font-size:1.3rem">😈</span>
        </div>
        <button id="menu-start-btn">START!</button>
    `;
    overlay.style.display='flex';
    document.getElementById('dark-toggle2').addEventListener('change',function(){
        darkMode=this.checked;
        document.getElementById('tt2').style.background=darkMode?'#FF4444':'#ccc';
        document.getElementById('th2').style.transform=darkMode?'translateX(24px)':'translateX(0)';
    });
    document.getElementById('menu-start-btn').addEventListener('click',()=>{
        overlay.style.display='none';
        initMusic();
        init(false);
        startLoop();
    });
}

function showCelebration(then){
    const cel=document.getElementById('celebration');
    cel.style.display='flex';
    // spawn confetti
    const colors=['#FF6B6B','#FFD700','#4ECDC4','#FF8C00','#6C63FF','#FF69B4','#00FA9A'];
    for(let i=0;i<80;i++){
        const div=document.createElement('div');
        div.className='confetti-piece';
        div.style.left=Math.random()*100+'vw';
        div.style.background=colors[rnd(colors.length)];
        div.style.animationDuration=(2+Math.random()*3)+'s';
        div.style.animationDelay=(Math.random()*2)+'s';
        div.style.width=(6+Math.random()*10)+'px';
        div.style.height=(6+Math.random()*10)+'px';
        cel.appendChild(div);
    }
    document.getElementById('celebBtn').onclick=()=>{
        cel.style.display='none';
        cel.querySelectorAll('.confetti-piece').forEach(d=>d.remove());
        then();
    };
}

// ── Controls ──────────────────────────────────────────────────────
const KEYS={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
function startCountdown(){countdown=3;waitingForInput=false;draw();const tick=setInterval(()=>{countdown--;draw();if(countdown<=0){clearInterval(tick);countdown=0;}},700);}
document.addEventListener('keydown',e=>{const d=KEYS[e.key];if(d&&!(d.x===-dir.x&&d.y===-dir.y)){nextDir=d;if(waitingForInput)startCountdown();e.preventDefault();}});
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;const d=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});if(!(d.x===-dir.x&&d.y===-dir.y)){nextDir=d;if(waitingForInput)startCountdown();}e.preventDefault();},{passive:false});

document.getElementById('startBtn').addEventListener('click',()=>{
    overlay.style.display='none';
    initMusic();
    init(false);
    draw();
    startLoop();
});
</script>
